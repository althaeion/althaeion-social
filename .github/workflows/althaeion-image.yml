name: althaeion-image

# Builds this branch with upstream's own Dockerfile.dev (the file Postiz builds its published image
# from) and pushes it to ghcr.io/althaeion/social-media. Publishing with GITHUB_TOKEN links the
# package to this public repository, so it is public and anyone can pull it without an account.
on:
  push:
    branches:
      - 'althaeion/**'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: althaeion-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      IMAGE: ghcr.io/althaeion/social-media
      TAG: 2.23.0-tp3
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Log in to the GitHub Container Registry
        run: echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build with upstream's Dockerfile.dev
        run: |
          docker build -f Dockerfile.dev --build-arg NEXT_PUBLIC_VERSION=v2.23.0 \
            -t "$IMAGE:$TAG" -t "$IMAGE:${GITHUB_SHA::12}" .

      - name: Push
        run: |
          docker push "$IMAGE:$TAG"
          docker push "$IMAGE:${GITHUB_SHA::12}"
          echo "digest: $(docker inspect --format '{{index .RepoDigests 0}}' "$IMAGE:$TAG")"
